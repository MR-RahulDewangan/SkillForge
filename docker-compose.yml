version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sih_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-sih_portal}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./apps/server
      dockerfile: Dockerfile
    container_name: sih_server
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-sih_portal}?schema=public
      JWT_SECRET: ${JWT_SECRET:-sih2026_super_secure_jwt_token_secret_key}
      AI_SERVICE_URL: http://ai-service:8000
    ports:
      - "5000:5000"

  ai-service:
    build:
      context: ./apps/ai-service
      dockerfile: Dockerfile
    container_name: sih_ai_service
    restart: always
    environment:
      PORT: 8000
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gemini-1.5-flash}
    ports:
      - "8000:8000"

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: sih_web
    restart: always
    depends_on:
      - server
    ports:
      - "3000:80"

volumes:
  postgres_data:
